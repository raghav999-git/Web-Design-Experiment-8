<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Collection Manager - Experiment 8</title>
<style>
:root { --accent:#a855f7; --accent2:#06b6d4; --glass:rgba(255,255,255,0.08); --border:rgba(255,255,255,0.15); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { min-height:100vh; background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#1a1a2e); background-size:400% 400%; animation:bg 15s ease infinite; color:#fff; padding:30px 20px; }
@keyframes bg { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
.container { max-width:1100px; margin:auto; }
header { text-align:center; margin-bottom:30px; }
h1 { font-size:2.5rem; background:linear-gradient(90deg,#a855f7,#06b6d4,#ec4899,#a855f7); background-size:300% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 4s linear infinite; }
@keyframes shine { to { background-position:300% center; } }
.stats { display:flex; justify-content:center; gap:20px; margin-top:15px; flex-wrap:wrap; }
.stat { background:var(--glass); border:1px solid var(--border); padding:12px 24px; border-radius:12px; backdrop-filter:blur(10px); }
.stat .num { font-size:1.8rem; font-weight:bold; color:var(--accent2); }
.stat .lbl { font-size:.75rem; opacity:.7; text-transform:uppercase; letter-spacing:1px; }
.toolbar { display:flex; gap:12px; margin-bottom:25px; flex-wrap:wrap; }
.search-box { flex:1; position:relative; min-width:200px; }
.search-box input { width:100%; padding:14px 18px 14px 45px; background:var(--glass); border:1px solid var(--border); border-radius:12px; color:#fff; font-size:15px; outline:none; backdrop-filter:blur(10px); transition:.3s; }
.search-box input:focus { border-color:var(--accent); box-shadow:0 0 20px rgba(168,85,247,.3); }
.search-box::before { content:'🔍'; position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; }
.btn { padding:14px 28px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:12px; color:#fff; font-weight:bold; font-size:15px; cursor:pointer; transition:.3s; }
.btn:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(168,85,247,.4); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
.book { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:20px; backdrop-filter:blur(10px); transition:.4s; position:relative; overflow:hidden; }
.book::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--accent),var(--accent2),#ec4899); transform:scaleX(0); transform-origin:left; transition:.4s; }
.book:hover { transform:translateY(-6px); border-color:var(--accent); box-shadow:0 15px 40px rgba(0,0,0,.4); }
.book:hover::before { transform:scaleX(1); }
.book h3 { font-size:1.15rem; margin-bottom:6px; }
.book .author { font-size:.85rem; color:var(--accent2); margin-bottom:4px; }
.book .year { font-size:.8rem; opacity:.6; margin-bottom:14px; }
.book .actions { display:flex; gap:8px; }
.book .actions button { flex:1; padding:8px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:bold; transition:.3s; }
.edit { background:rgba(251,191,36,.2); color:#fbbf24; }
.edit:hover { background:#fbbf24; color:#000; }
.del { background:rgba(239,68,68,.2); color:#ef4444; }
.del:hover { background:#ef4444; color:#fff; }
.empty { text-align:center; padding:60px 20px; opacity:.6; font-style:italic; }
.empty::before { content:'📚'; display:block; font-size:3rem; margin-bottom:15px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(5px); display:none; justify-content:center; align-items:center; z-index:100; padding:20px; }
.modal.active { display:flex; }
.modal-box { background:linear-gradient(135deg,#1a1a2e,#24243e); border:1px solid var(--border); border-radius:20px; padding:30px; width:100%; max-width:450px; animation:pop .3s; }
@keyframes pop { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.modal-box h2 { margin-bottom:20px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.modal-box input { width:100%; padding:13px 16px; margin-bottom:12px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:10px; color:#fff; font-size:14px; outline:none; }
.modal-box input:focus { border-color:var(--accent); }
.modal-actions { display:flex; gap:10px; margin-top:10px; }
.modal-actions button { flex:1; padding:12px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; }
.cancel { background:rgba(255,255,255,.1); color:#fff; }
.save { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:linear-gradient(135deg,#10b981,#059669); color:#fff; padding:14px 28px; border-radius:12px; font-weight:bold; opacity:0; transition:.4s; z-index:200; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.error { background:linear-gradient(135deg,#ef4444,#dc2626); }
@media(max-width:600px) { h1{font-size:1.8rem} .toolbar{flex-direction:column} }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Book Collection Manager</h1>
    <p style="opacity:.7;margin-top:8px">RESTful API Simulation · Full CRUD</p>
    <div class="stats">
      <div class="stat"><div class="num" id="totalBooks">0</div><div class="lbl">Total Books</div></div>
      <div class="stat"><div class="num" id="totalAuthors">0</div><div class="lbl">Authors</div></div>
      <div class="stat"><div class="num" id="lastAdded">—</div><div class="lbl">Latest</div></div>
    </div>
  </header>
  <div class="toolbar">
    <div class="search-box"><input id="search" placeholder="Search by title or author..."></div>
    <button class="btn" onclick="openModal()">+ Add Book</button>
  </div>
  <div id="grid" class="grid"></div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Add New Book</h2>
    <input id="titleInput" placeholder="Book Title">
    <input id="authorInput" placeholder="Author Name">
    <input id="yearInput" type="number" placeholder="Year (e.g., 2024)">
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveBook()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let books = JSON.parse(localStorage.getItem("books") || "[]");
let editId = null, searchTerm = "";
const save = () => localStorage.setItem("books", JSON.stringify(books));
const esc = s => String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render() {
  const grid = document.getElementById("grid");
  const filtered = books.filter(b => b.title.toLowerCase().includes(searchTerm) || b.author.toLowerCase().includes(searchTerm));
  grid.innerHTML = filtered.length === 0
    ? '<div class="empty">No books found. Click "Add Book" to start your collection!</div>'
    : filtered.map(b => `
      <div class="book">
        <h3>${esc(b.title)}</h3>
        <div class="author">by ${esc(b.author)}</div>
        <div class="year">${b.year || 'Unknown year'}</div>
        <div class="actions">
          <button class="edit" onclick="editBook(${b.id})">✏️ Edit</button>
          <button class="del" onclick="deleteBook(${b.id})">🗑️ Delete</button>
        </div>
      </div>`).join("");
  document.getElementById("totalBooks").textContent = books.length;
  document.getElementById("totalAuthors").textContent = new Set(books.map(b => b.author.toLowerCase())).size;
  document.getElementById("lastAdded").textContent = books[0] ? books[0].title.slice(0,10) + (books[0].title.length > 10 ? '...' : '') : '—';
}

function openModal(book = null) {
  editId = book ? book.id : null;
  document.getElementById("modalTitle").textContent = book ? "Edit Book" : "Add New Book";
  document.getElementById("titleInput").value = book ? book.title : "";
  document.getElementById("authorInput").value = book ? book.author : "";
  document.getElementById("yearInput").value = book ? book.year : "";
  document.getElementById("modal").classList.add("active");
  setTimeout(() => document.getElementById("titleInput").focus(), 100);
}

function closeModal() { document.getElementById("modal").classList.remove("active"); editId = null; }

function saveBook() {
  const title = document.getElementById("titleInput").value.trim();
  const author = document.getElementById("authorInput").value.trim();
  const year = document.getElementById("yearInput").value.trim();
  if (!title || !author) return showToast("Title and author are required!", true);
  if (editId) { books = books.map(b => b.id === editId ? { id: editId, title, author, year } : b); showToast("✅ Book updated!"); }
  else { books = [{ id: Date.now(), title, author, year }, ...books]; showToast("✅ Book added!"); }
  save(); render(); closeModal();
}

function editBook(id) { const b = books.find(x => x.id === id); if (b) openModal(b); }
function deleteBook(id) { books = books.filter(b => b.id !== id); save(); render(); showToast("🗑️ Book deleted", true); }

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => t.className = "toast", 2500);
}

document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value.toLowerCase(); render(); });
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
render();
</script>
</body>
</html>
